<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />

  <!-- Robot Head -->
  <rect x="28" y="32" width="72" height="58" rx="16" fill="url(#faceGrad)" stroke="#cdd6f4" stroke-width="2" />

  <!-- Antenna -->
  <line x1="64" y1="32" x2="64" y2="20" stroke="#cdd6f4" stroke-width="4" stroke-linecap="round" />
  <circle cx="64" cy="18" r="6" fill="#a6e3a1" filter="url(#glow)" />

  <!-- Ears -->
  <rect x="22" y="50" width="6" height="22" rx="3" fill="#89b4fa" />
  <rect x="100" y="50" width="6" height="22" rx="3" fill="#89b4fa" />

  <!-- Eyes (Glowing Cyan/Teal) -->
  <circle cx="48" cy="56" r="7" fill="#89dceb" filter="url(#glow)" />
  <circle cx="80" cy="56" r="7" fill="#89dceb" filter="url(#glow)" />

  <!-- Smile / Voice wave -->
  <path d="M 46 72 Q 64 82 82 72" stroke="#f5c2e7" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Subtle MCP Dots -->
  <circle cx="44" cy="104" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="64" cy="104" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="84" cy="104" r="3" fill="#ffffff" opacity="0.8" />
</svg>
